[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padic-tools"
version = "0.1.0"
description = "Precision-aware p-adic arithmetic, special functions and exact algebraic bridges"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "David Jaroš"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Mathematics"]

[project.optional-dependencies]
symbolic = ["sympy>=1.12"]
complex = ["mpmath>=1.3"]
docs = ["sphinx>=7", "sphinxcontrib-katex>=0.9", "beautifulsoup4>=4.12"]
test = ["pytest>=8", "sympy>=1.12", "mpmath>=1.3"]
dev = ["pytest>=8", "sympy>=1.12", "mpmath>=1.3", "sphinx>=7", "sphinxcontrib-katex>=0.9", "beautifulsoup4>=4.12", "build>=1"]

[project.urls]
Repository = "https://github.com/DavJ/padic-tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
