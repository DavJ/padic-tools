name: Tests, packages and HTML manual
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest
  pari-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pari-gp
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/test_pari_optional.py
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[docs,symbolic,complex]'
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m sphinx -W --keep-going -b doctest docs docs/_build/doctest
      - run: python scripts/build_manual.py
      - uses: actions/upload-artifact@v4
        with:
          name: html-documentation
          path: docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: portable-html-manual
          path: docs/_build/padic-tools-manual.html
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/padic-wheel-check
      - run: /tmp/padic-wheel-check/bin/python -m pip install --no-deps dist/*.whl
      - run: /tmp/padic-wheel-check/bin/python -c 'from padic_tools import Qp, UnramifiedQuadraticField, zeta_p; assert zeta_p(-3,Qp(5)).is_congruent("-31/30"); L=UnramifiedQuadraticField(Qp(3),[1,0,1]); x=L(1,2); assert x.norm().contains(5); assert (x*x.inverse()).is_congruent(1); assert x.residue().frobenius()==x.residue()**3'
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-packages
          path: dist/*
